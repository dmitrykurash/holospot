<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Volume hologram · holospot</title>
<style>html, body { margin: 0; height: 100%; background: #000; } canvas { display: block; touch-action: none; }</style>
<script type="importmap">{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/",
  "holospot": "../dist/holo.js"
} }</script>
<script type="module">
// The Volume Hologram material on a card: a 3D subject floats at depth inside the film and turns as the card tilts.
// SUBJECT: eagle, chip, wolf, globe, skull, falcon or emblem (assets/holo3d/), or the URL of a volume you baked
// with tools/bake-hologram.mjs.
import * as THREE from "three";
import { Holo, shotCamera, shotRotation } from "holospot";

const SUBJECT = new URLSearchParams(location.search).get("subject") ?? "eagle";

const renderer = new THREE.WebGLRenderer();
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera();

const holo = new Holo(renderer, { background: "black" });
const card = holo.card({ material: "volume", settings: { "volume.subject": SUBJECT } });
scene.add(card);
holo.expose();

const obj = holo.get(card);
await obj.ready;
const frame = () => shotCamera(camera, obj, { aspect: innerWidth / innerHeight });
frame();
const rest = shotRotation(obj.pose);
const target = { x: 0, y: 0 }, now = { x: 0, y: 0 };
addEventListener("pointermove", (e) => {
  target.y = ((e.clientX / innerWidth) * 2 - 1) * 20;
  target.x = ((e.clientY / innerHeight) * 2 - 1) * 20;
});
renderer.setAnimationLoop(() => {
  now.x += (target.x - now.x) * 0.12;
  now.y += (target.y - now.y) * 0.12;
  card.rotation.set(rest.x + THREE.MathUtils.degToRad(now.x), rest.y + THREE.MathUtils.degToRad(now.y), rest.z, "XYZ");
  holo.render(scene, camera);
});
addEventListener("resize", () => { renderer.setSize(innerWidth, innerHeight); frame(); });
</script>
