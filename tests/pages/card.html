<!doctype html>
<meta charset="utf-8">
<title>holospot · card test page</title>
<style>html, body { margin: 0; height: 100%; background: #000; } canvas { display: block; width: 100vw; height: 100vh; }</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js" } }</script>
<script type="module">
// Query: material (default prism; emboss = the paper card), settings (JSON), quality, bg, size (scene units), flip=1.
import * as THREE from "three";
import { Holo, shotCamera, shotRotation } from "../../dist/holo.js";

const q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera();
const holo = new Holo(renderer, { quality: q.get("quality") ?? undefined, background: q.get("bg") ?? undefined });
holo.expose();
const card = holo.card({
  material: q.get("material") ?? undefined, size: Number(q.get("size") ?? 3),
  settings: q.get("settings") ? JSON.parse(q.get("settings")) : undefined,
});
card.position.set(1, 2, -3);
scene.add(card);
const obj = holo.get(card);
await obj.ready;
card.rotation.copy(shotRotation({ ...obj.pose, flip: q.get("flip") === "1" }));
shotCamera(camera, obj, { aspect: innerWidth / innerHeight, lensMm: Number(holo.scene["dof.lens"]) });
renderer.setAnimationLoop(() => holo.render(scene, camera, { time: 0, dt: 0, still: true }));
</script>
