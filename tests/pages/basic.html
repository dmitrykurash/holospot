<!doctype html>
<meta charset="utf-8">
<title>holospot · test page</title>
<style>html, body { margin: 0; height: 100%; background: #000; } canvas { display: block; width: 100vw; height: 100vh; }</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js" } }</script>
<script type="module">
// The kit's own test page. Query: material, shape (knot | sphere | box | plane), sizeMm, quality, compose, bg, lights,
// settings (JSON: flat ids or a Copy settings blob), extra=1 (adds an ordinary three.js object and a light), spin=1,
// scenebg=rrggbb (a plain colour as scene.background).
import * as THREE from "three";
import { Holo, shotCamera, shotRotation } from "../../dist/holo.js";

const q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: q.get("alpha") === "1" });
renderer.setPixelRatio(Number(q.get("dpr") ?? 1));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(22, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 0, 8);

const shapes = {
  knot: () => new THREE.TorusKnotGeometry(1, 0.34, 220, 36),
  sphere: () => new THREE.SphereGeometry(1, 96, 64),
  box: () => new THREE.BoxGeometry(1.4, 1.4, 1.4, 1, 1, 1),
  plane: () => new THREE.PlaneGeometry(1.26, 1.76),
};
const mesh = new THREE.Mesh((shapes[q.get("shape") ?? "knot"] ?? shapes.knot)(), new THREE.MeshStandardMaterial({ color: 0x888888 }));
scene.add(mesh);
if (q.get("scenebg")) scene.background = new THREE.Color(`#${q.get("scenebg")}`);
if (q.get("extra") === "1") {
  scene.background = new THREE.Color(0x202630);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x223344, 2.5));
  const floor = new THREE.Mesh(new THREE.BoxGeometry(6, 0.2, 6), new THREE.MeshStandardMaterial({ color: 0x556070 }));
  floor.position.y = -1.9;
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 4, 24), new THREE.MeshStandardMaterial({ color: 0xcc5533 }));
  post.position.set(0.9, 0, 1.6);
  scene.add(floor, post);
}

const holo = new Holo(renderer, {
  quality: q.get("quality") ?? undefined, compose: q.get("compose") ?? undefined,
  background: q.get("bg") ?? undefined, lights: q.get("lights") ?? undefined,
});
holo.expose();
const obj = holo.apply(mesh, {
  material: q.get("material") ?? undefined, sizeMm: Number(q.get("sizeMm") ?? 90),
  settings: q.get("settings") ? JSON.parse(q.get("settings")) : undefined, look: q.get("look") ?? undefined,
});
await obj.ready;
if (q.get("pose") !== "0") mesh.rotation.copy(shotRotation(obj.pose));
if (q.get("extra") !== "1") shotCamera(camera, obj, { aspect: innerWidth / innerHeight, lensMm: Number(holo.scene["dof.lens"]) });
const spin = q.get("spin") === "1";
renderer.setAnimationLoop((t) => {
  if (spin) mesh.rotation.y = t / 1500;
  holo.render(scene, camera, { still: !spin });
});
</script>
